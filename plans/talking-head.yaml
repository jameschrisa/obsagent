# Talking head with screen share and camera inset. Apply: obsagent plan apply talking-head --dry-run
title: Talking head show
target: youtube
preset: youtube-1080p60
profile: obsagent-youtube-1080p60
scenes:
  - name: Camera
    sources:
      - {source: camera, layout: fill}
  - name: Screen + camera
    sources:
      - {source: screen, layout: fill}
      - {source: camera, layout: inset, corner: bottom-right, width_pct: 25, margin_px: 40}
sources:
  camera:
    name: StreamCam
    device: Logitech StreamCam      # matched by name against the OBS device list
  mic:
    name: StreamCam Mic
    device: Logitech StreamCam
    global: true                    # global audio source (Settings > Audio), heard in every scene
  screen:
    name: Screen
    display: main
# Shared backdrop at the bottom of every scene (image or color). Relative paths resolve against the repo root.
background: {image: "assets/backgrounds/slate-soft.png"}
replace_default_mic: true           # disable the default "Mic/Aux" so the MacBook mic does not double up
checklist:
  - Screen & System Audio Recording, Camera and Microphone allowed for OBS
  - Camera framing and lighting checked
  - Mic level peaks between -12 and -6 dB
  - Do Not Disturb on
  - 60-second preflight recording reviewed
  - Unlisted 2-minute test stream watched with obsagent ws monitor
youtube:
  title: Talking head show
  privacy: unlisted
  latency: low
  rtmps: true
# Remote guests via VDO.Ninja. Add people with: obsagent guests add talking-head --name NAME
# Links and the room password are never stored here (state in ~/.config/obsagent/shows, password in Keychain).
guests:
  max: 3
  panel_scene: "Panel"
  solo_scenes: true
# Optional show details, used to fill the guest guide (quote the values):
# show_time: "Thursday 6 Nov, 7:00 PM Pacific"
# tech_check: "Wednesday 5 Nov, 5:00 PM Pacific"
# host_contact: "text 555-0100"
# youtube:
#   watch_url: "https://youtube.com/live/XXXX"   # add this key inside the youtube block above
