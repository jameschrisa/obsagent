name: youtube-1440p60
description: YouTube Live 1440p60.
target: youtube
encoder: videotoolbox_h264
width: 2560
height: 1440
fps: 60
video_bitrate_kbps: 34000
rate_control: CBR
keyint_sec: 2
profile: high
bframes: false
