name: youtube-4k30
description: YouTube Live 4K30.
target: youtube
encoder: videotoolbox_h264
width: 3840
height: 2160
fps: 30
video_bitrate_kbps: 42000
rate_control: CBR
keyint_sec: 2
profile: high
bframes: false
audio_bitrate_kbps: 128
sample_rate: 48000
channels: Stereo
source: https://support.google.com/youtube/answer/2853702
notes: YouTube recommended H.264 bitrate (HEVC column for -hevc), checked 2026-10-31 in knowledge/youtube.md. Lower it to fit upload with --bitrate.
warnings: ["4K30 is at the edge of what an M1 Pro (16 GB) can do while running a camera and screen capture; test with ws monitor before going live.", "Needs about 25+ Mbps of stable upload. YouTube recommends HEVC for 4K."]
